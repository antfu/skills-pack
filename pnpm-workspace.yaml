ignoreWorkspaceRootCheck: true
catalogMode: prefer

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - skills-npm@3.0.0

trustPolicy: no-downgrade

update:
  ignoreDeps:
    - typescript@7

shellEmulator: true

allowBuilds:
  esbuild: true
  simple-git-hooks: true

catalogs:
  cli:
    '@antfu/eslint-config': ^9.5.1
    bumpp: ^12.3.0
    eslint: ^10.11.0
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.1
    nano-staged: ^1.0.2
    simple-git-hooks: ^2.14.0
    skills-npm: ^3.0.0
    tsx: ^4.23.15
    typescript: ^6.0.3
    yaml: ^2.9.1
  types:
    '@types/node': ^26.6.2
